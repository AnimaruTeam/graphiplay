name: Deploy demo

on:
    push:
        branches: [monarch]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
              with:
                  version: "11"

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Build the standalone page
              run: pnpm build:site
              env:
                  SITE_BASE: /graphiplay/

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: site

            - id: deployment
              uses: actions/deploy-pages@v5
